# Included into every location in nginx.conf. nginx does not merge add_header
# across levels - a location that sets one header of its own drops every
# add_header it would have inherited - so these have to be repeated rather
# than set once at server level.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# the app needs these itself; nothing embedded in it does
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

# A Content-Security-Policy is deliberately not set. index.html still carries
# an inline script (the PeerJS/Vite workaround) and WebRTC has to reach
# arbitrary peers, so a policy tight enough to be worth having needs testing
# against a real deployment first.
