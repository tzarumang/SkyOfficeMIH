server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers for the app.
  #
  # Repeated into every location rather than set once here, because nginx does
  # not merge add_header across levels: a location that sets even one header of
  # its own drops every add_header it would otherwise have inherited. Both
  # locations below set a Cache-Control, so at server level these four applied
  # to nothing but the fallback location.
  include /etc/nginx/skyoffice-security-headers.conf;

  # Vite's own output is content hashed - index-DEADBEEF.js - so the name
  # changes whenever the content does and it can be cached forever.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$" {
    include /etc/nginx/skyoffice-security-headers.conf;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Everything else under /assets/ is a game asset copied verbatim out of
  # client/public - the map, the tilesets, the character sheets - and it is
  # loaded by a fixed name that does not change when the file does.
  #
  # These used to be caught by the same `immutable` rule as the hashed build
  # output above, which meant redrawing the map or fixing a tileset reached
  # nobody who had already opened the site: `immutable` does not merely let a
  # browser keep its copy, it tells it not even to ask. That is the trap the
  # office drawings hit on the server, and this is the same answer - `no-cache`
  # still stores the file, it just has to revalidate, which is one 304 whenever
  # nothing has moved.
  location /assets/ {
    include /etc/nginx/skyoffice-security-headers.conf;
    add_header Cache-Control "no-cache";
  }

  # written at container start, so it must never be cached
  location = /config.js {
    include /etc/nginx/skyoffice-security-headers.conf;
    add_header Cache-Control "no-store" always;
  }

  location / {
    include /etc/nginx/skyoffice-security-headers.conf;
    try_files $uri $uri/ /index.html;
  }
}
