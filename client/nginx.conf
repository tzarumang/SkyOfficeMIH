server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Same headers netlify.toml sets, for the containerised deployment.
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # the app needs these itself; nothing embedded in it does
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # hashed build assets can be cached hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # written at container start, so it must never be cached
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
