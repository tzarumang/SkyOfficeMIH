name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - name: Install server dependencies
        run: yarn install --frozen-lockfile

      - name: Install shared types
        run: yarn install --frozen-lockfile
        working-directory: types

      - name: Install client dependencies
        run: yarn install --frozen-lockfile
        working-directory: client

      - name: Typecheck server
        run: yarn tsc --project server/tsconfig.server.json --noEmit

      - name: Build client
        run: yarn build
        working-directory: client

      - name: Test
        run: yarn test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      # Fails on advisories that are not already recorded in
      # .audit-baseline.json, so a new one blocks the build while the accepted
      # backlog does not. See scripts/audit.js.
      - name: Audit dependencies
        run: yarn audit:check
