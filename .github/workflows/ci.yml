name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install server dependencies
        run: yarn install --frozen-lockfile

      - name: Install shared types
        run: yarn install --frozen-lockfile
        working-directory: types

      - name: Install client dependencies
        run: yarn install --frozen-lockfile
        working-directory: client

      # Lints the whole repo - server, client and shared types - from the one
      # flat config at the root. Cheapest check in the job, so it runs first.
      - name: Lint
        run: yarn lint

      - name: Typecheck server
        run: yarn tsc --project server/tsconfig.server.json --noEmit

      - name: Build client
        run: yarn build
        working-directory: client

      # The client half: pure logic only - the ICE and bitrate rules, the id
      # encoding, the redux slices. Everything that needs a canvas or a real
      # peer is still checked by hand.
      - name: Test client
        run: yarn test
        working-directory: client

      - name: Test server
        run: yarn test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Fails on advisories that are not already recorded in
      # .audit-baseline.json, so a new one blocks the build while the accepted
      # backlog does not. See scripts/audit.js.
      - name: Audit dependencies
        run: yarn audit:check

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build server image
        run: docker build -f Dockerfile -t skyoffice-server:ci .

      - name: Build client image
        run: docker build -f client/Dockerfile -t skyoffice-client:ci .

      # Proves the images actually run: that the server finds the Tiled map at
      # the path the Dockerfile puts it, that the monitor stays unmounted
      # without credentials, and that the client's runtime config really is
      # written from the environment rather than baked in at build time.
      - name: Smoke test the images
        run: |
          set -eux
          docker run -d --name sky-server -e NODE_ENV=production -p 2567:2567 skyoffice-server:ci
          docker run -d --name sky-client \
            -e SERVER_URL=wss://server.example.test \
            -e PEER_HOST=peer.example.test \
            -e PEER_PORT=443 \
            -p 8080:80 skyoffice-client:ci

          # Both containers bind their port some way after `docker run` returns,
          # so poll each one before asserting anything about it. The client used
          # to be curled with no readiness wait at all, which raced nginx's bind
          # and died on a reset socket. Give up early on a container that has
          # already exited rather than spending the full minute on a corpse.
          wait_for() {
            local name=$1 url=$2
            for _ in $(seq 1 30); do
              if [ "$(docker inspect -f '{{.State.Running}}' "$name")" != true ]; then
                echo "$name is no longer running; it never served $url" >&2
                return 1
              fi
              curl -fsS "$url" >/dev/null 2>&1 && return 0
              sleep 2
            done
            echo "timed out after 60s waiting for $name to serve $url" >&2
            return 1
          }

          wait_for sky-server http://localhost:2567/health
          wait_for sky-client http://localhost:8080/

          curl -fsS http://localhost:2567/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2567/colyseus)" = "404"

          curl -fsS http://localhost:8080/ | grep -q 'SkyOffice'
          curl -fsS http://localhost:8080/config.js | grep -q 'wss://server.example.test'
          curl -fsS http://localhost:8080/config.js | grep -q 'peer.example.test'
          curl -fsSI http://localhost:8080/ | grep -qi 'x-frame-options: DENY'

      - name: Container state and logs on failure
        if: failure()
        run: |
          docker ps -a || true
          echo '--- sky-server ---'
          docker logs sky-server || true
          echo '--- sky-client ---'
          docker logs sky-client || true
