# SkyOffice stack for Portainer.
#
# Deploy as a Portainer stack pointed at this repository, then set the variables
# below in the stack's environment section. Every URL here is what the *browser*
# is told to connect to, so they have to be reachable from wherever people open
# the app - not container names.
#
# Ports bind to 127.0.0.1 by default, so the only way in is whatever you put in
# front of them - a Cloudflare tunnel, a reverse proxy. Set BIND_ADDRESS=0.0.0.0
# to reach them from other machines directly.
#
# Copy .env.example to .env for a local `docker compose up`.

volumes:
  office-data:

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: skyoffice-server
    restart: unless-stopped
    environment:
      PORT: 2567
      NODE_ENV: production
      # Origins allowed to reach matchmaking, e.g. https://office.example.com
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # Without both of these the /colyseus dashboard is not mounted at all.
      COLYSEUS_MONITOR_USER: ${COLYSEUS_MONITOR_USER:-}
      COLYSEUS_MONITOR_PASSWORD: ${COLYSEUS_MONITOR_PASSWORD:-}
      OFFICE_STORE_PATH: ${OFFICE_STORE_PATH:-/app/data/offices.json}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-2567}:2567"
    volumes:
      # offices given a lifetime are recorded here, so their links keep working
      # across restarts - without this they would only last as long as the
      # container does
      - office-data:/app/data

  # Self-hosted signalling. Without this the client falls back to the free
  # public PeerJS broker, which puts call metadata on a third party and shares
  # an id namespace with every other app using the default.
  peerjs:
    image: peerjs/peerjs-server:1.0.2
    restart: unless-stopped
    command: ["--port", "9000", "--path", "/"]
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PEER_PUBLIC_PORT:-9000}:9000"

  # Media relay, for the calls that cannot be made peer to peer at all.
  #
  # Signalling only introduces two browsers; the audio and video then go
  # straight between them, which works right up until neither side's network
  # will accept an unsolicited packet. Symmetric NAT and carrier-grade NAT do
  # exactly that, and between them they cover most mobile data and a good share
  # of home ISPs. Those calls do not degrade, they never connect.
  #
  # Opt in with `docker compose --profile turn up`, because it is only useful
  # once TURN_USERNAME and TURN_CREDENTIAL are set and its ports are actually
  # reachable from the browsers - see .env.example.
  coturn:
    image: coturn/coturn:4.6.2-alpine
    profiles: ["turn"]
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --realm=${TURN_REALM:-skyoffice}
      - --user=${TURN_USERNAME:-}:${TURN_CREDENTIAL:-}
      # long-term credentials, so an unauthenticated stranger cannot use this
      # to relay their own traffic
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # the range the relay hands out, kept narrow so it can be published
      - --min-port=49160
      - --max-port=49200
      # what the relay tells peers to send to. Behind NAT it has no way to know
      # its own public address, and without this it advertises the container's.
      - --external-ip=${TURN_EXTERNAL_IP:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${TURN_PORT:-3478}:3478/udp"
      - "${BIND_ADDRESS:-127.0.0.1}:${TURN_PORT:-3478}:3478/tcp"
      - "${BIND_ADDRESS:-127.0.0.1}:49160-49200:49160-49200/udp"

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    image: skyoffice-client
    restart: unless-stopped
    depends_on:
      - server
      - peerjs
    environment:
      # ws:// or wss:// URL of the server service above, as the browser sees it.
      # Leave empty and the client looks for a server on its own hostname:2567.
      SERVER_URL: ${SERVER_URL:-}
      # Hostname of the peerjs service above, as the browser sees it. Leave
      # empty to fall back to the public PeerJS broker.
      PEER_HOST: ${PEER_HOST:-}
      PEER_PORT: ${PEER_PORT:-}
      PEER_PATH: ${PEER_PATH:-/}
      # set to "false" when reaching peerjs over plain http
      PEER_SECURE: ${PEER_SECURE:-}
      # Relay for peers whose networks will not hole-punch. Comma separated;
      # offering both udp and tcp costs nothing and rescues the networks that
      # block one of them. Empty means calls are peer to peer or not at all.
      TURN_URL: ${TURN_URL:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${CLIENT_PORT:-8080}:80"
