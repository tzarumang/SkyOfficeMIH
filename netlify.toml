[build]  
  command = "cd types && yarn && cd ../client && yarn && yarn build"
  publish = "client/dist"

# Rule for router history mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # the app needs these itself; nothing embedded in it does
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=()"

# A Content-Security-Policy is not set here on purpose. index.html still carries
# an inline script (the PeerJS/Vite workaround), and WebRTC needs to reach
# arbitrary peers, so a policy tight enough to be worth having needs to be
# tested against a real deployment first.
